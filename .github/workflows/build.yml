name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Rename APK
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          cp "$APK" app/build/outputs/apk/debug/GlassCamera-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GlassCamera-debug
          path: app/build/outputs/apk/debug/GlassCamera-debug.apk

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: latest
          name: "Glass Camera"
          prerelease: true
          make_latest: true
          files: app/build/outputs/apk/debug/GlassCamera-debug.apk
